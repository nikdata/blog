{{ define "main" }}
<section class="page">
  <header class="page-header">
    <h1>{{ .Title }}</h1>
  </header>
  <div class="page-body">
    {{ .Content }}
    {{ range .Pages.ByDate.Reverse }}
      <article class="list-item">
        <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "Jan 2, 2006" }}</time>
        <a href="{{ .RelPermalink }}">{{ .Title }}</a>
      </article>
    {{ end }}
  </div>
</section>
{{ end }}
